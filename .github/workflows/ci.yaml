name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

  # Weekly, so SDK, dependency and runner-image drift shows up on its
  # own rather than waiting for the next push.
  schedule:
    - cron: '15 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Install dependencies
        run: dart pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: dart analyze --fatal-infos
      - name: Run tests
        run: dart test
